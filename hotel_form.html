<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hotel Booking Form</title>
</head>
<body>
    <form action="">
    <center>
    <h2><b>HOTEL ROOM BOOKING FORM</b></h2>
    </center>
    <table align="center" border="3px">
        <td>
    <label for="fname">Full name:-</label>
    <input type="text" placeholder="Enter Your Name" id="fname" name="fname"><br><br>

    <label for="email">Email:-</label>

    <input type="text" placeholder="abc@xyz.com" id="email" name="email"><br><br>
    <label for="phone">Phone No.:-</label>

    <input type="tel" placeholder="10 Digit Number" id="phone" name="phone"><br><br>
    
   <label for="state">State:-</label>
    <input type="text" id="state" name="state"><br><br>

    <label for="city">City:-</label>
    <input type="text" id="city" name="city"><br><br>

    
    <label for="pincode">Pincode:-</label>
    <input type="text" id="pincode" name="pincode"><br><br>

    <label for="arrivalDate">Checkin Date and Time:-</label><br>
    <input type="date" id="arrivalDate" name="arrivalDate">
    <input type="time" id="arrivalTime" name="arrivalTime"><br><br>

    <label for="departureDate">Checkout Date and Time:-</label><br>
    <input type="date" id="departureDate" name="departureDate">
    <input type="time" id="departureTime" name="departureTime"><br><br>

    <label for="payment">Payment Mode:-</label>
    <input type="radio" id="cash" name="payment" value="cash">Cash  
    <input type="radio" id="card" name="payment" value="card">Card
    <input type="radio" id="online" name="payment" value="online">Online<br><br>

    <label for="request">Any Querry:-</label><br>
    <textarea placeholder="For any request" id="request" name="request" cols="30" rows="5"></textarea><br><br>
    
    <input type="submit" value="Submit Form">
    <input type="reset" value="Reset All Details">
        </td>
    </table>
    </form>
</body>
</html>
